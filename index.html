<script>
/* Thème et direction posés avant le premier rendu : pas de clignotement
   blanc en mode sombre, pas de bascule LTR→RTL sous les yeux. */
(function () {
  "use strict";
  try {
    var th = localStorage.getItem("essencefes.theme");
    if (th && th !== "auto") document.documentElement.setAttribute("data-theme", th);
    var lg = localStorage.getItem("essencefes.langue");
    if (lg === "ar") {
      document.documentElement.lang = "ar";
      document.documentElement.dir = "rtl";
    } else if (lg) {
      document.documentElement.lang = lg;
    }
  } catch (e) { /* navigation privée */ }
})();
</script>

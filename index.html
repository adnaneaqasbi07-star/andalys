<script>
/* Thème et direction posés avant le premier rendu : pas de clignotement
   clair en mode sombre, pas de bascule LTR→RTL sous les yeux. */
(function () {
  "use strict";
  try {
    var th = localStorage.getItem("andalys.theme");
    if (th && th !== "auto") document.documentElement.setAttribute("data-theme", th);
    var lg = localStorage.getItem("andalys.langue");
    if (lg === "ar") {
      document.documentElement.lang = "ar";
      document.documentElement.dir = "rtl";
    } else if (lg) {
      document.documentElement.lang = lg;
    }
  } catch (e) { /* navigation privée */ }
})();
</script>
